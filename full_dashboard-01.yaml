# ══════════════════════════════════════════════════════════════════════════════
# SMART HOME DASHBOARD — TODAS AS 9 TELAS (tipo: masonry / Lovelace clássico)
# ══════════════════════════════════════════════════════════════════════════════
# COMO USAR:
#   Lovelace > ⋮ > Editar > YAML bruto > substitua TODO o conteúdo
#   OU: Configurações > Painéis > Adicionar painel > Lovelace YAML manual
#
# TIPO: masonry (layout de cartões padrão, compatível com todo o HA)
# Para usar "Sections" (novo HA 2024+), troque type: masonry → type: sections
#
# DEPENDÊNCIAS (HACS): button-card · card-mod · mini-graph-card
# ══════════════════════════════════════════════════════════════════════════════

title: Smart Home
views:

  - title: "🏠 Dashboard"
    path: dashboard
    icon: mdi:home-variant
    background: "#EFE7D8"
    cards:

      # ── Cabeçalho: saudação ─────────────────────────────────────────────────
      - type: custom:button-card
        name: "Bem-vinda em casa"
        label: "Olá, Maycon 👋"
        show_label: true
        show_icon: false
        styles:
          card:
            - background: "transparent"
            - box-shadow: "none"
            - padding: "20px 16px 8px"
          name:
            - font-size: "11px"
            - font-weight: "600"
            - letter-spacing: "0.04em"
            - color: "#7A7388"
            - text-transform: "uppercase"
          label:
            - font-size: "26px"
            - font-weight: "700"
            - letter-spacing: "-0.02em"
            - color: "#2E2742"
            - margin-top: "4px"

      # ── Status strip: Temperatura / Umidade / Qualidade do Ar ───────────────
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: sensor.sala_temperatura
            name: "Sala"
            label: "Temperatura"
            show_label: true
            icon: mdi:thermometer
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "999px"
                - padding: "8px 12px"
                - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
              icon:
                - color: "#2E2742"
                - width: "16px"
              name:
                - font-size: "13px"
                - font-weight: "700"
                - color: "#2E2742"
              label:
                - font-size: "10px"
                - color: "#7A7388"
            custom_fields:
              icon_bg:
            card_mod:
              style: |
                ha-card {
                  --card-background: #F1DCD4;
                }

          - type: custom:button-card
            entity: sensor.sala_umidade
            name: "Umidade"
            show_label: false
            icon: mdi:water-percent
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "999px"
                - padding: "8px 12px"
                - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
              icon:
                - color: "#7FB892"
                - width: "16px"
              name:
                - font-size: "13px"
                - font-weight: "700"
                - color: "#2E2742"

          - type: custom:button-card
            entity: sensor.sala_qualidade_ar
            name: "Qual. Ar"
            show_label: false
            icon: mdi:leaf
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "999px"
                - padding: "8px 12px"
                - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
              icon:
                - color: "#7FB892"
                - width: "16px"
              name:
                - font-size: "13px"
                - font-weight: "700"
                - color: "#2E2742"

      # ── Hero Card: Cena Ativa ────────────────────────────────────────────────
      - type: custom:button-card
        entity: scene.boa_tarde
        name: "Boa Tarde"
        label: "6 dispositivos ajustados para conforto vespertino"
        show_label: true
        icon: mdi:weather-sunny
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.boa_tarde
        hold_action:
          action: navigate
          navigation_path: /lovelace/cenas
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "32px"
            - padding: "20px"
            - box-shadow: "0 16px 40px rgba(46,39,66,0.10)"
            - overflow: "hidden"
            - position: "relative"
          name:
            - font-size: "22px"
            - font-weight: "700"
            - letter-spacing: "-0.02em"
            - color: "#2E2742"
            - text-align: "left"
          label:
            - font-size: "12px"
            - color: "#7A7388"
            - text-align: "left"
            - line-height: "1.4"
            - margin-top: "4px"
          icon:
            - color: "#FFFFFF"
            - width: "28px"
            - position: "absolute"
            - right: "20px"
            - top: "20px"
        custom_fields:
          cena_ativa:
            card:
              type: custom:button-card
              name: "Cena ativa"
              show_icon: false
              styles:
                card:
                  - background: "transparent"
                  - box-shadow: "none"
                  - padding: "0"
                name:
                  - font-size: "11px"
                  - font-weight: "700"
                  - color: "#E36A2A"
                  - letter-spacing: "0.08em"
                  - text-transform: "uppercase"
        card_mod:
          style: |
            ha-card::before {
              content: '';
              position: absolute;
              top: -10px;
              right: -30px;
              width: 140px;
              height: 140px;
              border-radius: 50%;
              background: #F08648;
              z-index: 0;
            }
            ha-card::after {
              content: '';
              position: absolute;
              bottom: -20px;
              right: 10px;
              width: 80px;
              height: 80px;
              border-radius: 50%;
              background: #F6B584;
              opacity: 0.9;
              z-index: 0;
            }

      # ── Tabs de Cômodo (navegação rápida) ───────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            name: "Sala"
            icon: mdi:sofa
            tap_action:
              action: navigate
              navigation_path: /lovelace/dashboard
            styles:
              card:
                - background: "#2E2742"
                - border-radius: "999px"
                - padding: "8px 16px"
                - min-height: "36px"
                - box-shadow: "0 4px 12px rgba(46,39,66,0.25)"
              name:
                - font-size: "12px"
                - font-weight: "700"
                - color: "#FFFFFF"
              icon:
                - color: "#FFFFFF"
                - width: "14px"

          - type: custom:button-card
            name: "Cozinha"
            icon: mdi:chef-hat
            tap_action:
              action: navigate
              navigation_path: /lovelace/cozinha
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "999px"
                - padding: "8px 16px"
                - min-height: "36px"
                - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
              name:
                - font-size: "12px"
                - font-weight: "600"
                - color: "#7A7388"
              icon:
                - color: "#7A7388"
                - width: "14px"

          - type: custom:button-card
            name: "Quarto"
            icon: mdi:bed
            tap_action:
              action: navigate
              navigation_path: /lovelace/quarto
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "999px"
                - padding: "8px 16px"
                - min-height: "36px"
                - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
              name:
                - font-size: "12px"
                - font-weight: "600"
                - color: "#7A7388"
              icon:
                - color: "#7A7388"
                - width: "14px"

          - type: custom:button-card
            name: "Escritório"
            icon: mdi:desk
            tap_action:
              action: navigate
              navigation_path: /lovelace/escritorio
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "999px"
                - padding: "8px 16px"
                - min-height: "36px"
                - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
              name:
                - font-size: "12px"
                - font-weight: "600"
                - color: "#7A7388"
              icon:
                - color: "#7A7388"
                - width: "14px"

      # ── Grid de Dispositivos (4 cards: 2×2) ─────────────────────────────────
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: light.sala_pendente_norte
            name: "Pendente Norte"
            label: "Sala · 70%"
            show_label: true
            icon: mdi:ceiling-light
            tap_action:
              action: toggle
            hold_action:
              action: navigate
              navigation_path: /lovelace/luz
            state_display: "[[[ return entity.state === 'on' ? 'Ligada' : 'Desligado' ]]]"
            styles:
              card:
                - background: "[[[ return entity.state === 'on' ? '#FFFFFF' : '#FBF6EC' ]]]"
                - border-radius: "26px"
                - padding: "14px"
                - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
                - min-height: "120px"
              icon:
                - color: "[[[ return entity.state === 'on' ? '#2E2742' : '#7A7388' ]]]"
                - width: "18px"
                - padding: "9px"
                - border-radius: "50%"
                - background: "[[[ return entity.state === 'on' ? '#F6B584' : 'rgba(46,39,66,0.06)' ]]]"
              name:
                - font-size: "14px"
                - font-weight: "700"
                - color: "#2E2742"
                - text-align: "left"
                - margin-top: "14px"
              label:
                - font-size: "11px"
                - color: "#7A7388"
                - text-align: "left"

          - type: custom:button-card
            entity: climate.sala_ac
            name: "Ar-Cond. Sala"
            label: "24° · Auto"
            show_label: true
            icon: mdi:air-conditioner
            tap_action:
              action: navigate
              navigation_path: /lovelace/clima
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "26px"
                - padding: "14px"
                - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
                - min-height: "120px"
              icon:
                - color: "#2E2742"
                - width: "18px"
                - padding: "9px"
                - border-radius: "50%"
                - background: "#D2C5E6"
              name:
                - font-size: "14px"
                - font-weight: "700"
                - color: "#2E2742"
                - text-align: "left"
                - margin-top: "14px"
              label:
                - font-size: "11px"
                - color: "#7A7388"
                - text-align: "left"

          - type: custom:button-card
            entity: cover.sala_cortinas
            name: "Cortinas Sala"
            label: "[[[ return entity.attributes.current_position ? `Abertas ${entity.attributes.current_position}%` : 'Fechadas' ]]]"
            show_label: true
            icon: mdi:curtains
            tap_action:
              action: navigate
              navigation_path: /lovelace/acessos
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "26px"
                - padding: "14px"
                - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
                - min-height: "120px"
              icon:
                - color: "#2E2742"
                - width: "18px"
                - padding: "9px"
                - border-radius: "50%"
                - background: "#BFDDC4"
              name:
                - font-size: "14px"
                - font-weight: "700"
                - color: "#2E2742"
                - text-align: "left"
                - margin-top: "14px"
              label:
                - font-size: "11px"
                - color: "#7A7388"
                - text-align: "left"

          - type: custom:button-card
            entity: switch.sala_tomada_tv
            name: "TV Sala"
            label: "[[[ return entity.state === 'on' ? 'Ligada' : 'Desligado' ]]]"
            show_label: true
            icon: mdi:television
            tap_action:
              action: toggle
            styles:
              card:
                - background: "[[[ return entity.state === 'on' ? '#FFFFFF' : '#FBF6EC' ]]]"
                - border-radius: "26px"
                - padding: "14px"
                - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
                - min-height: "120px"
              icon:
                - color: "[[[ return entity.state === 'on' ? '#2E2742' : '#7A7388' ]]]"
                - width: "18px"
                - padding: "9px"
                - border-radius: "50%"
                - background: "[[[ return entity.state === 'on' ? '#F1DCD4' : 'rgba(46,39,66,0.06)' ]]]"
              name:
                - font-size: "14px"
                - font-weight: "700"
                - color: "#2E2742"
                - text-align: "left"
                - margin-top: "14px"
              label:
                - font-size: "11px"
                - color: "#7A7388"
                - text-align: "left"

      # ── Card de Música (escuro) ──────────────────────────────────────────────
      - type: media-control
        entity: media_player.sala
        card_mod:
          style: |
            ha-card {
              background: #2E2742 !important;
              border-radius: 26px !important;
              box-shadow: 0 18px 40px rgba(20,15,35,0.35) !important;
              color: #fff !important;
            }
            ha-card * {
              color: #fff !important;
            }

      # ── Nav Inferior ────────────────────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            icon: mdi:home-variant
            name: ""
            tap_action:
              action: navigate
              navigation_path: /lovelace/dashboard
            styles:
              card:
                - background: "transparent"
                - box-shadow: "none"
                - min-height: "48px"
              icon:
                - color: "#F08648"
                - width: "24px"

          - type: custom:button-card
            icon: mdi:view-grid
            name: ""
            tap_action:
              action: navigate
              navigation_path: /lovelace/dispositivos
            styles:
              card:
                - background: "transparent"
                - box-shadow: "none"
                - min-height: "48px"
              icon:
                - color: "#7A7388"
                - width: "24px"

          - type: custom:button-card
            icon: mdi:refresh-auto
            name: ""
            tap_action:
              action: navigate
              navigation_path: /lovelace/cenas
            styles:
              card:
                - background: "transparent"
                - box-shadow: "none"
                - min-height: "48px"
              icon:
                - color: "#7A7388"
                - width: "24px"

          - type: custom:button-card
            icon: mdi:lightning-bolt
            name: ""
            tap_action:
              action: navigate
              navigation_path: /lovelace/energia
            styles:
              card:
                - background: "transparent"
                - box-shadow: "none"
                - min-height: "48px"
              icon:
                - color: "#7A7388"
                - width: "24px"

          - type: custom:button-card
            icon: mdi:cog
            name: ""
            tap_action:
              action: navigate
              navigation_path: /lovelace/config
            styles:
              card:
                - background: "transparent"
                - box-shadow: "none"
                - min-height: "48px"
              icon:
                - color: "#7A7388"
                - width: "24px"

  - title: "💡 Luz"
    path: luz
    icon: mdi:lightbulb-outline
    background: "#EFE7D8"
    cards:

      # ── Cabeçalho com nome da luminária ────────────────────────────────────
      - type: custom:button-card
        entity: light.sala_pendente_norte
        name: "Pendente Norte"
        label: "Sala · Luminária"
        show_label: true
        icon: mdi:arrow-left
        tap_action:
          action: navigate
          navigation_path: /lovelace/dashboard
        styles:
          card:
            - background: "transparent"
            - box-shadow: "none"
            - padding: "16px 16px 8px"
            - flex-direction: "row"
            - justify-content: "space-between"
          icon:
            - color: "#2E2742"
            - width: "20px"
            - background: "#FFFFFF"
            - padding: "10px"
            - border-radius: "50%"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.08)"
          name:
            - font-size: "16px"
            - font-weight: "700"
            - color: "#2E2742"
          label:
            - font-size: "11px"
            - color: "#7A7388"
            - font-weight: "600"
            - text-transform: "uppercase"
            - letter-spacing: "0.06em"

      # ── Controle de Brilho (slider nativo HA) ──────────────────────────────
      - type: light
        entity: light.sala_pendente_norte
        card_mod:
          style: |
            ha-card {
              background: #FFFFFF;
              border-radius: 32px;
              box-shadow: 0 16px 40px rgba(46,39,66,0.10);
              padding: 20px;
            }

      # ── Temperatura de Cor ─────────────────────────────────────────────────
      - type: custom:button-card
        entity: light.sala_pendente_norte
        name: "Temperatura de Cor"
        label: "[[[ if (!entity.attributes.color_temp_kelvin) return '—'; return entity.attributes.color_temp_kelvin + ' K'; ]]]"
        show_label: true
        show_icon: false
        tap_action:
          action: more-info
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "26px"
            - padding: "16px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
          name:
            - font-size: "11px"
            - font-weight: "700"
            - color: "#7A7388"
            - text-transform: "uppercase"
            - letter-spacing: "0.06em"
            - text-align: "left"
          label:
            - font-size: "18px"
            - font-weight: "700"
            - color: "#2E2742"
            - text-align: "left"
        card_mod:
          style: |
            ha-card::after {
              content: '';
              display: block;
              height: 14px;
              border-radius: 999px;
              background: linear-gradient(90deg, #FFB870 0%, #FFE7C2 50%, #E4F0FF 100%);
              margin-top: 12px;
            }

      # ── Informação de Uso (em linha) ────────────────────────────────────────
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            entity: sensor.sala_pendente_energia_hoje
            name: "Uso hoje"
            label: "kWh consumidos"
            show_label: true
            icon: mdi:clock-outline
            styles:
              card:
                - background: "#2E2742"
                - border-radius: "20px"
                - padding: "14px"
                - box-shadow: "0 8px 24px rgba(46,39,66,0.2)"
              icon:
                - color: "rgba(255,255,255,0.5)"
                - width: "14px"
              name:
                - font-size: "20px"
                - font-weight: "700"
                - color: "#FFFFFF"
              label:
                - font-size: "11px"
                - color: "#F08648"
                - font-weight: "600"

          - type: custom:button-card
            entity: light.sala_pendente_norte
            name: "[[[ return entity.state === 'on' ? 'Ligada' : 'Desligada' ]]]"
            label: "Energia"
            show_label: true
            icon: "[[[ return entity.state === 'on' ? 'mdi:power' : 'mdi:power-off' ]]]"
            tap_action:
              action: toggle
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "20px"
                - padding: "14px"
                - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
              icon:
                - color: "[[[ return entity.state === 'on' ? '#F08648' : '#7A7388' ]]]"
                - width: "20px"
              name:
                - font-size: "18px"
                - font-weight: "700"
                - color: "#2E2742"
              label:
                - font-size: "11px"
                - color: "#7A7388"
                - text-transform: "uppercase"
                - letter-spacing: "0.06em"
                - font-weight: "600"

      # ── Presets ────────────────────────────────────────────────────────────
      - type: custom:button-card
        name: "PRESETS"
        show_icon: false
        styles:
          card:
            - background: "transparent"
            - box-shadow: "none"
            - padding: "8px 4px 0"
          name:
            - font-size: "11px"
            - font-weight: "700"
            - color: "#7A7388"
            - letter-spacing: "0.06em"
            - text-transform: "uppercase"
            - text-align: "left"

      - type: horizontal-stack
        cards:
          - type: custom:button-card
            name: "Leitura"
            icon: mdi:book-open-variant
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.luz_leitura
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "20px"
                - padding: "12px 10px"
                - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
                - min-height: "70px"
              icon:
                - color: "#E36A2A"
                - width: "18px"
                - padding: "7px"
                - border-radius: "50%"
                - background: "#F6B584"
              name:
                - font-size: "12px"
                - font-weight: "700"
                - color: "#2E2742"
                - margin-top: "8px"

          - type: custom:button-card
            name: "Cinema"
            icon: mdi:movie-outline
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.luz_cinema
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "20px"
                - padding: "12px 10px"
                - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
                - min-height: "70px"
              icon:
                - color: "#9E8AC4"
                - width: "18px"
                - padding: "7px"
                - border-radius: "50%"
                - background: "#D2C5E6"
              name:
                - font-size: "12px"
                - font-weight: "700"
                - color: "#2E2742"
                - margin-top: "8px"

          - type: custom:button-card
            name: "Foco"
            icon: mdi:head-flash-outline
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.luz_foco
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "20px"
                - padding: "12px 10px"
                - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
                - min-height: "70px"
              icon:
                - color: "#7FB892"
                - width: "18px"
                - padding: "7px"
                - border-radius: "50%"
                - background: "#BFDDC4"
              name:
                - font-size: "12px"
                - font-weight: "700"
                - color: "#2E2742"
                - margin-top: "8px"

          - type: custom:button-card
            name: "Jantar"
            icon: mdi:candle
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.luz_jantar
            styles:
              card:
                - background: "#FFFFFF"
                - border-radius: "20px"
                - padding: "12px 10px"
                - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
                - min-height: "70px"
              icon:
                - color: "#E5B7AC"
