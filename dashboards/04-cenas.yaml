# ══════════════════════════════════════════════════════════════════════════════
# TELA 04 — CENAS & ROTINAS
# Design: busca, card hero "Cinema em Família" (plum + blob laranja),
#          grid 2×3 de cenas com blobs coloridos e estado ativo
# ══════════════════════════════════════════════════════════════════════════════
# COMO USAR: adicione em `views:` do seu dashboard Lovelace
# ══════════════════════════════════════════════════════════════════════════════

title: "🎬 Cenas"
path: cenas
icon: mdi:movie-play-outline
background: "#EFE7D8"
cards:

  # ── Cabeçalho ───────────────────────────────────────────────────────────
  - type: custom:button-card
    name: "Cenas"
    label: "Sua casa"
    show_label: true
    show_icon: false
    styles:
      card:
        - background: "transparent"
        - box-shadow: "none"
        - padding: "20px 16px 8px"
      name:
        - font-size: "26px"
        - font-weight: "700"
        - letter-spacing: "-0.02em"
        - color: "#2E2742"
        - text-align: "left"
      label:
        - font-size: "11px"
        - color: "#7A7388"
        - font-weight: "600"
        - text-transform: "uppercase"
        - letter-spacing: "0.06em"
        - text-align: "left"

  # ── Card Hero: Cinema em Família ────────────────────────────────────────
  - type: custom:button-card
    entity: scene.cinema_em_familia
    name: "Cinema em Família"
    label: "Diminui luzes, fecha cortinas, liga TV e ajusta o som"
    show_label: true
    icon: mdi:movie-play
    tap_action:
      action: call-service
      service: scene.turn_on
      target:
        entity_id: scene.cinema_em_familia
    styles:
      card:
        - background: "#2E2742"
        - border-radius: "32px"
        - padding: "22px 20px 20px"
        - box-shadow: "0 18px 40px rgba(20,15,35,0.35)"
        - overflow: "hidden"
        - position: "relative"
        - min-height: "160px"
      icon:
        - color: "#FFFFFF"
        - width: "24px"
        - display: "none"
      name:
        - font-size: "24px"
        - font-weight: "700"
        - letter-spacing: "-0.02em"
        - color: "#FFFFFF"
        - text-align: "left"
        - line-height: "1.1"
      label:
        - font-size: "12px"
        - color: "rgba(255,255,255,0.65)"
        - text-align: "left"
        - line-height: "1.4"
        - margin-top: "6px"
        - max-width: "200px"
    card_mod:
      style: |
        ha-card::before {
          content: 'Sugerida';
          position: absolute;
          top: 22px;
          right: 22px;
          background: rgba(255,255,255,0.15);
          color: #fff;
          font-size: 10px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          padding: 4px 10px;
          border-radius: 999px;
        }
        ha-card::after {
          content: '';
          position: absolute;
          top: -30px;
          right: -40px;
          width: 180px;
          height: 180px;
          border-radius: 50%;
          background: #F08648;
          opacity: 0.95;
          z-index: 0;
        }

  # ── Título seção ────────────────────────────────────────────────────────
  - type: custom:button-card
    name: "Suas cenas"
    show_icon: false
    styles:
      card:
        - background: "transparent"
        - box-shadow: "none"
        - padding: "16px 4px 4px"
      name:
        - font-size: "14px"
        - font-weight: "700"
        - color: "#2E2742"
        - text-align: "left"

  # ── Grid de Cenas (2×3) ─────────────────────────────────────────────────
  - type: grid
    columns: 2
    square: false
    cards:
      # Cena: Bom Dia
      - type: custom:button-card
        entity: scene.bom_dia
        name: "Bom Dia"
        label: "4 dispositivos · 07:00"
        show_label: true
        icon: mdi:weather-sunset-up
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.bom_dia
        styles:
          card:
            - background: "#F6B584"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
            - min-height: "130px"
            - overflow: "hidden"
            - position: "relative"
          icon:
            - color: "#2E2742"
            - width: "16px"
            - padding: "8px"
            - border-radius: "50%"
            - background: "#FFFFFF"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.12)"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#2E2742"
            - text-align: "left"
          label:
            - font-size: "10px"
            - color: "rgba(46,39,66,0.65)"
            - text-align: "left"

      # Cena: Foco
      - type: custom:button-card
        entity: scene.foco
        name: "Foco"
        label: "3 dispositivos · manual"
        show_label: true
        icon: mdi:head-flash-outline
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.foco
        styles:
          card:
            - background: "#BFDDC4"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
            - min-height: "130px"
            - overflow: "hidden"
            - position: "relative"
          icon:
            - color: "#2E2742"
            - width: "16px"
            - padding: "8px"
            - border-radius: "50%"
            - background: "#FFFFFF"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.12)"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#2E2742"
            - text-align: "left"
          label:
            - font-size: "10px"
            - color: "rgba(46,39,66,0.65)"
            - text-align: "left"

      # Cena: Almoço
      - type: custom:button-card
        entity: scene.almoco
        name: "Almoço"
        label: "5 dispositivos · 12:00"
        show_label: true
        icon: mdi:food
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.almoco
        styles:
          card:
            - background: "#D2C5E6"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
            - min-height: "130px"
            - overflow: "hidden"
            - position: "relative"
          icon:
            - color: "#2E2742"
            - width: "16px"
            - padding: "8px"
            - border-radius: "50%"
            - background: "#FFFFFF"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.12)"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#2E2742"
            - text-align: "left"
          label:
            - font-size: "10px"
            - color: "rgba(46,39,66,0.65)"
            - text-align: "left"

      # Cena: Cinema (dark)
      - type: custom:button-card
        entity: scene.cinema
        name: "Cinema"
        label: "6 dispositivos · noite"
        show_label: true
        icon: mdi:movie-play
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.cinema
        styles:
          card:
            - background: "#3D3654"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 16px 40px rgba(46,39,66,0.25)"
            - min-height: "130px"
            - overflow: "hidden"
            - position: "relative"
          icon:
            - color: "#FFFFFF"
            - width: "16px"
            - padding: "8px"
            - border-radius: "50%"
            - background: "rgba(255,255,255,0.15)"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#FFFFFF"
            - text-align: "left"
          label:
            - font-size: "10px"
            - color: "rgba(255,255,255,0.55)"
            - text-align: "left"

      # Cena: Boa Noite
      - type: custom:button-card
        entity: scene.boa_noite
        name: "Boa Noite"
        label: "8 dispositivos · 22:30"
        show_label: true
        icon: mdi:weather-night
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.boa_noite
        styles:
          card:
            - background: "#F1DCD4"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
            - min-height: "130px"
            - overflow: "hidden"
            - position: "relative"
          icon:
            - color: "#2E2742"
            - width: "16px"
            - padding: "8px"
            - border-radius: "50%"
            - background: "#FFFFFF"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.12)"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#2E2742"
            - text-align: "left"
          label:
            - font-size: "10px"
            - color: "rgba(46,39,66,0.65)"
            - text-align: "left"

      # Cena: Ausente
      - type: custom:button-card
        entity: scene.ausente
        name: "Ausente"
        label: "10 dispositivos · segurança"
        show_label: true
        icon: mdi:home-lock
        tap_action:
          action: call-service
          service: scene.turn_on
          target:
            entity_id: scene.ausente
        styles:
          card:
            - background: "#F08648"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 8px 24px rgba(240,134,72,0.3)"
            - min-height: "130px"
            - overflow: "hidden"
            - position: "relative"
          icon:
            - color: "#FFFFFF"
            - width: "16px"
            - padding: "8px"
            - border-radius: "50%"
            - background: "rgba(255,255,255,0.2)"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#FFFFFF"
            - text-align: "left"
          label:
            - font-size: "10px"
            - color: "rgba(255,255,255,0.75)"
            - text-align: "left"

  # ── Automações ativas ───────────────────────────────────────────────────
  - type: custom:button-card
    name: "Automações"
    label: "Gerenciar automações do HA"
    show_label: true
    icon: mdi:robot-outline
    tap_action:
      action: navigate
      navigation_path: /config/automation
    styles:
      card:
        - background: "#2E2742"
        - border-radius: "26px"
        - padding: "16px"
        - box-shadow: "0 16px 40px rgba(46,39,66,0.2)"
      icon:
        - color: "#F08648"
        - width: "22px"
        - padding: "9px"
        - border-radius: "50%"
        - background: "rgba(240,134,72,0.2)"
      name:
        - font-size: "13px"
        - font-weight: "700"
        - color: "#FFFFFF"
        - text-align: "left"
        - margin-top: "4px"
      label:
        - font-size: "11px"
        - color: "rgba(255,255,255,0.55)"
        - text-align: "left"
