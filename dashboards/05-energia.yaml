# ══════════════════════════════════════════════════════════════════════════════
# TELA 05 — ENERGIA
# Design: card hero plum com kWh + % economia, gráfico de barras 14 dias,
#          ranking de maiores consumidores com barras de progresso
# ══════════════════════════════════════════════════════════════════════════════
# COMO USAR: adicione em `views:` do seu dashboard Lovelace
# NOTA:      ative a integração "Monitoramento de Energia" no HA para dados reais
# ══════════════════════════════════════════════════════════════════════════════

title: "⚡ Energia"
path: energia
icon: mdi:lightning-bolt
background: "#EFE7D8"
cards:

  # ── Cabeçalho ───────────────────────────────────────────────────────────
  - type: custom:button-card
    name: "Energia"
    label: "Esta semana"
    show_label: true
    show_icon: false
    styles:
      card:
        - background: "transparent"
        - box-shadow: "none"
        - padding: "20px 16px 8px"
      name:
        - font-size: "16px"
        - font-weight: "700"
        - color: "#2E2742"
      label:
        - font-size: "11px"
        - color: "#7A7388"
        - font-weight: "600"
        - text-transform: "uppercase"
        - letter-spacing: "0.06em"

  # ── Hero Card: Consumo Total ─────────────────────────────────────────────
  - type: custom:button-card
    entity: sensor.energia_total_semana
    name: "kWh"
    label: "Consumo total da semana"
    show_label: true
    icon: mdi:lightning-bolt
    tap_action:
      action: navigate
      navigation_path: /energy
    styles:
      card:
        - background: "#2E2742"
        - border-radius: "32px"
        - padding: "20px"
        - box-shadow: "0 18px 40px rgba(20,15,35,0.35)"
        - overflow: "hidden"
        - position: "relative"
        - min-height: "140px"
      icon:
        - color: "#FFFFFF"
        - width: "28px"
        - position: "absolute"
        - right: "20px"
        - top: "20px"
      name:
        - font-size: "54px"
        - font-weight: "700"
        - letter-spacing: "-0.03em"
        - color: "#FFFFFF"
        - line-height: "1"
        - text-align: "left"
      label:
        - font-size: "11px"
        - color: "rgba(255,255,255,0.7)"
        - text-align: "left"
        - text-transform: "uppercase"
        - letter-spacing: "0.08em"
        - font-weight: "700"
    card_mod:
      style: |
        ha-card::before {
          content: '−12% vs sem. anterior';
          position: absolute;
          bottom: 20px;
          left: 20px;
          background: #BFDDC4;
          color: #2E2742;
          font-size: 11px;
          font-weight: 700;
          padding: 4px 10px;
          border-radius: 999px;
        }
        ha-card::after {
          content: '';
          position: absolute;
          top: -30px;
          right: -30px;
          width: 160px;
          height: 160px;
          border-radius: 50%;
          background: #F08648;
          opacity: 0.95;
        }

  # ── Gráfico de Histórico (mini-graph-card) ─────────────────────────────
  - type: custom:mini-graph-card
    entity: sensor.energia_total_diaria
    name: "Consumo Diário"
    detail: 2
    hours_to_show: 336
    points_per_hour: 0.1428
    group_by: date
    show:
      state: true
      graph: bar
      labels: true
      name: true
      icon: false
      extrema: true
    bar_spacing: 4
    line_color: "#F08648"
    card_mod:
      style: |
        ha-card {
          background: #FFFFFF !important;
          border-radius: 26px !important;
          box-shadow: 0 8px 24px rgba(46,39,66,0.08) !important;
          padding: 16px;
        }

  # ── Seletor de Período ──────────────────────────────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: "Dia"
        tap_action:
          action: navigate
          navigation_path: /energy
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "999px"
            - padding: "8px 0"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
          name:
            - font-size: "12px"
            - font-weight: "700"
            - color: "#7A7388"

      - type: custom:button-card
        name: "Semana"
        tap_action:
          action: navigate
          navigation_path: /energy
        styles:
          card:
            - background: "#2E2742"
            - border-radius: "999px"
            - padding: "8px 0"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.2)"
          name:
            - font-size: "12px"
            - font-weight: "700"
            - color: "#FFFFFF"

      - type: custom:button-card
        name: "Mês"
        tap_action:
          action: navigate
          navigation_path: /energy
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "999px"
            - padding: "8px 0"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
          name:
            - font-size: "12px"
            - font-weight: "700"
            - color: "#7A7388"

  # ── Maiores Consumidores ────────────────────────────────────────────────
  - type: custom:button-card
    name: "Maiores consumidores"
    show_icon: false
    styles:
      card:
        - background: "transparent"
        - box-shadow: "none"
        - padding: "8px 4px 4px"
      name:
        - font-size: "14px"
        - font-weight: "700"
        - color: "#2E2742"
        - text-align: "left"

  # Ar-condicionado (maior consumidor)
  - type: custom:button-card
    entity: sensor.ac_sala_energia
    name: "Ar-Cond. Sala"
    label: "[[[ return entity.state + ' kWh · 34%' ]]]"
    show_label: true
    icon: mdi:air-conditioner
    styles:
      card:
        - background: "#FFFFFF"
        - border-radius: "20px"
        - padding: "12px 14px"
        - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
      icon:
        - color: "#E36A2A"
        - width: "18px"
        - padding: "10px"
        - border-radius: "12px"
        - background: "#F6B584"
      name:
        - font-size: "13px"
        - font-weight: "700"
        - color: "#2E2742"
        - text-align: "left"
      label:
        - font-size: "11px"
        - color: "#7A7388"
        - text-align: "right"
    card_mod:
      style: |
        ha-card::after {
          content: '';
          display: block;
          height: 5px;
          background: rgba(46,39,66,0.06);
          border-radius: 999px;
          margin-top: 8px;
          overflow: hidden;
          position: relative;
        }

  # Geladeira
  - type: custom:button-card
    entity: sensor.geladeira_energia
    name: "Geladeira"
    label: "[[[ return entity.state + ' kWh · 25%' ]]]"
    show_label: true
    icon: mdi:fridge-outline
    styles:
      card:
        - background: "#FFFFFF"
        - border-radius: "20px"
        - padding: "12px 14px"
        - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
      icon:
        - color: "#9E8AC4"
        - width: "18px"
        - padding: "10px"
        - border-radius: "12px"
        - background: "#D2C5E6"
      name:
        - font-size: "13px"
        - font-weight: "700"
        - color: "#2E2742"
        - text-align: "left"
      label:
        - font-size: "11px"
        - color: "#7A7388"
        - text-align: "right"

  # Iluminação
  - type: custom:button-card
    entity: sensor.iluminacao_energia
    name: "Iluminação"
    label: "[[[ return entity.state + ' kWh · 15%' ]]]"
    show_label: true
    icon: mdi:lightbulb-group-outline
    styles:
      card:
        - background: "#FFFFFF"
        - border-radius: "20px"
        - padding: "12px 14px"
        - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
      icon:
        - color: "#7FB892"
        - width: "18px"
        - padding: "10px"
        - border-radius: "12px"
        - background: "#BFDDC4"
      name:
        - font-size: "13px"
        - font-weight: "700"
        - color: "#2E2742"
        - text-align: "left"
      label:
        - font-size: "11px"
        - color: "#7A7388"
        - text-align: "right"

  # TV Sala
  - type: custom:button-card
    entity: sensor.tv_sala_energia
    name: "TV Sala"
    label: "[[[ return entity.state + ' kWh · 8%' ]]]"
    show_label: true
    icon: mdi:television
    styles:
      card:
        - background: "#FFFFFF"
        - border-radius: "20px"
        - padding: "12px 14px"
        - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
      icon:
        - color: "#E5B7AC"
        - width: "18px"
        - padding: "10px"
        - border-radius: "12px"
        - background: "#F1DCD4"
      name:
        - font-size: "13px"
        - font-weight: "700"
        - color: "#2E2742"
        - text-align: "left"
      label:
        - font-size: "11px"
        - color: "#7A7388"
        - text-align: "right"

  # ── Link para o painel de Energia nativo ────────────────────────────────
  - type: custom:button-card
    name: "Ver painel completo de Energia"
    icon: mdi:open-in-new
    tap_action:
      action: navigate
      navigation_path: /energy
    styles:
      card:
        - background: "#F08648"
        - border-radius: "999px"
        - padding: "14px"
        - box-shadow: "0 8px 24px rgba(240,134,72,0.3)"
      icon:
        - color: "#FFFFFF"
        - width: "18px"
      name:
        - font-size: "13px"
        - font-weight: "700"
        - color: "#FFFFFF"
