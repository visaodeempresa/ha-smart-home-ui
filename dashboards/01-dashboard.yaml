# ══════════════════════════════════════════════════════════════════════════════
# TELA 01 — DASHBOARD PRINCIPAL
# Design: saudação, status (temp/umid/ar), cena ativa, tabs de cômodo,
#          grid de dispositivos, card de música, nav inferior
# ══════════════════════════════════════════════════════════════════════════════
# COMO USAR:
#   Lovelace > Editar painel > YAML bruto > adicione este bloco em `views:`
# DEPENDÊNCIAS: button-card, card-mod, mini-graph-card (instalar via HACS)
# ══════════════════════════════════════════════════════════════════════════════

title: "🏠 Dashboard"
path: dashboard
icon: mdi:home-variant
background: "#EFE7D8"
cards:

  # ── Cabeçalho: saudação ─────────────────────────────────────────────────
  - type: custom:button-card
    name: "Bem-vinda em casa"
    label: "Olá, Maycon 👋"
    show_label: true
    show_icon: false
    styles:
      card:
        - background: "transparent"
        - box-shadow: "none"
        - padding: "20px 16px 8px"
      name:
        - font-size: "11px"
        - font-weight: "600"
        - letter-spacing: "0.04em"
        - color: "#7A7388"
        - text-transform: "uppercase"
      label:
        - font-size: "26px"
        - font-weight: "700"
        - letter-spacing: "-0.02em"
        - color: "#2E2742"
        - margin-top: "4px"

  # ── Status strip: Temperatura / Umidade / Qualidade do Ar ───────────────
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.sala_temperatura
        name: "Sala"
        label: "Temperatura"
        show_label: true
        icon: mdi:thermometer
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "999px"
            - padding: "8px 12px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
          icon:
            - color: "#2E2742"
            - width: "16px"
          name:
            - font-size: "13px"
            - font-weight: "700"
            - color: "#2E2742"
          label:
            - font-size: "10px"
            - color: "#7A7388"
        custom_fields:
          icon_bg:
        card_mod:
          style: |
            ha-card {
              --card-background: #F1DCD4;
            }

      - type: custom:button-card
        entity: sensor.sala_umidade
        name: "Umidade"
        show_label: false
        icon: mdi:water-percent
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "999px"
            - padding: "8px 12px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
          icon:
            - color: "#7FB892"
            - width: "16px"
          name:
            - font-size: "13px"
            - font-weight: "700"
            - color: "#2E2742"

      - type: custom:button-card
        entity: sensor.sala_qualidade_ar
        name: "Qual. Ar"
        show_label: false
        icon: mdi:leaf
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "999px"
            - padding: "8px 12px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
          icon:
            - color: "#7FB892"
            - width: "16px"
          name:
            - font-size: "13px"
            - font-weight: "700"
            - color: "#2E2742"

  # ── Hero Card: Cena Ativa ────────────────────────────────────────────────
  - type: custom:button-card
    entity: scene.boa_tarde
    name: "Boa Tarde"
    label: "6 dispositivos ajustados para conforto vespertino"
    show_label: true
    icon: mdi:weather-sunny
    tap_action:
      action: call-service
      service: scene.turn_on
      target:
        entity_id: scene.boa_tarde
    hold_action:
      action: navigate
      navigation_path: /lovelace/cenas
    styles:
      card:
        - background: "#FFFFFF"
        - border-radius: "32px"
        - padding: "20px"
        - box-shadow: "0 16px 40px rgba(46,39,66,0.10)"
        - overflow: "hidden"
        - position: "relative"
      name:
        - font-size: "22px"
        - font-weight: "700"
        - letter-spacing: "-0.02em"
        - color: "#2E2742"
        - text-align: "left"
      label:
        - font-size: "12px"
        - color: "#7A7388"
        - text-align: "left"
        - line-height: "1.4"
        - margin-top: "4px"
      icon:
        - color: "#FFFFFF"
        - width: "28px"
        - position: "absolute"
        - right: "20px"
        - top: "20px"
    custom_fields:
      cena_ativa:
        card:
          type: custom:button-card
          name: "Cena ativa"
          show_icon: false
          styles:
            card:
              - background: "transparent"
              - box-shadow: "none"
              - padding: "0"
            name:
              - font-size: "11px"
              - font-weight: "700"
              - color: "#E36A2A"
              - letter-spacing: "0.08em"
              - text-transform: "uppercase"
    card_mod:
      style: |
        ha-card::before {
          content: '';
          position: absolute;
          top: -10px;
          right: -30px;
          width: 140px;
          height: 140px;
          border-radius: 50%;
          background: #F08648;
          z-index: 0;
        }
        ha-card::after {
          content: '';
          position: absolute;
          bottom: -20px;
          right: 10px;
          width: 80px;
          height: 80px;
          border-radius: 50%;
          background: #F6B584;
          opacity: 0.9;
          z-index: 0;
        }

  # ── Tabs de Cômodo (navegação rápida) ───────────────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        name: "Sala"
        icon: mdi:sofa
        tap_action:
          action: navigate
          navigation_path: /lovelace/dashboard
        styles:
          card:
            - background: "#2E2742"
            - border-radius: "999px"
            - padding: "8px 16px"
            - min-height: "36px"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.25)"
          name:
            - font-size: "12px"
            - font-weight: "700"
            - color: "#FFFFFF"
          icon:
            - color: "#FFFFFF"
            - width: "14px"

      - type: custom:button-card
        name: "Cozinha"
        icon: mdi:chef-hat
        tap_action:
          action: navigate
          navigation_path: /lovelace/cozinha
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "999px"
            - padding: "8px 16px"
            - min-height: "36px"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
          name:
            - font-size: "12px"
            - font-weight: "600"
            - color: "#7A7388"
          icon:
            - color: "#7A7388"
            - width: "14px"

      - type: custom:button-card
        name: "Quarto"
        icon: mdi:bed
        tap_action:
          action: navigate
          navigation_path: /lovelace/quarto
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "999px"
            - padding: "8px 16px"
            - min-height: "36px"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
          name:
            - font-size: "12px"
            - font-weight: "600"
            - color: "#7A7388"
          icon:
            - color: "#7A7388"
            - width: "14px"

      - type: custom:button-card
        name: "Escritório"
        icon: mdi:desk
        tap_action:
          action: navigate
          navigation_path: /lovelace/escritorio
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "999px"
            - padding: "8px 16px"
            - min-height: "36px"
            - box-shadow: "0 4px 12px rgba(46,39,66,0.06)"
          name:
            - font-size: "12px"
            - font-weight: "600"
            - color: "#7A7388"
          icon:
            - color: "#7A7388"
            - width: "14px"

  # ── Grid de Dispositivos (4 cards: 2×2) ─────────────────────────────────
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: light.sala_pendente_norte
        name: "Pendente Norte"
        label: "Sala · 70%"
        show_label: true
        icon: mdi:ceiling-light
        tap_action:
          action: toggle
        hold_action:
          action: navigate
          navigation_path: /lovelace/luz
        state_display: "[[[ return entity.state === 'on' ? 'Ligada' : 'Desligado' ]]]"
        styles:
          card:
            - background: "[[[ return entity.state === 'on' ? '#FFFFFF' : '#FBF6EC' ]]]"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
            - min-height: "120px"
          icon:
            - color: "[[[ return entity.state === 'on' ? '#2E2742' : '#7A7388' ]]]"
            - width: "18px"
            - padding: "9px"
            - border-radius: "50%"
            - background: "[[[ return entity.state === 'on' ? '#F6B584' : 'rgba(46,39,66,0.06)' ]]]"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#2E2742"
            - text-align: "left"
            - margin-top: "14px"
          label:
            - font-size: "11px"
            - color: "#7A7388"
            - text-align: "left"

      - type: custom:button-card
        entity: climate.sala_ac
        name: "Ar-Cond. Sala"
        label: "24° · Auto"
        show_label: true
        icon: mdi:air-conditioner
        tap_action:
          action: navigate
          navigation_path: /lovelace/clima
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
            - min-height: "120px"
          icon:
            - color: "#2E2742"
            - width: "18px"
            - padding: "9px"
            - border-radius: "50%"
            - background: "#D2C5E6"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#2E2742"
            - text-align: "left"
            - margin-top: "14px"
          label:
            - font-size: "11px"
            - color: "#7A7388"
            - text-align: "left"

      - type: custom:button-card
        entity: cover.sala_cortinas
        name: "Cortinas Sala"
        label: "[[[ return entity.attributes.current_position ? `Abertas ${entity.attributes.current_position}%` : 'Fechadas' ]]]"
        show_label: true
        icon: mdi:curtains
        tap_action:
          action: navigate
          navigation_path: /lovelace/acessos
        styles:
          card:
            - background: "#FFFFFF"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
            - min-height: "120px"
          icon:
            - color: "#2E2742"
            - width: "18px"
            - padding: "9px"
            - border-radius: "50%"
            - background: "#BFDDC4"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#2E2742"
            - text-align: "left"
            - margin-top: "14px"
          label:
            - font-size: "11px"
            - color: "#7A7388"
            - text-align: "left"

      - type: custom:button-card
        entity: switch.sala_tomada_tv
        name: "TV Sala"
        label: "[[[ return entity.state === 'on' ? 'Ligada' : 'Desligado' ]]]"
        show_label: true
        icon: mdi:television
        tap_action:
          action: toggle
        styles:
          card:
            - background: "[[[ return entity.state === 'on' ? '#FFFFFF' : '#FBF6EC' ]]]"
            - border-radius: "26px"
            - padding: "14px"
            - box-shadow: "0 8px 24px rgba(46,39,66,0.08)"
            - min-height: "120px"
          icon:
            - color: "[[[ return entity.state === 'on' ? '#2E2742' : '#7A7388' ]]]"
            - width: "18px"
            - padding: "9px"
            - border-radius: "50%"
            - background: "[[[ return entity.state === 'on' ? '#F1DCD4' : 'rgba(46,39,66,0.06)' ]]]"
          name:
            - font-size: "14px"
            - font-weight: "700"
            - color: "#2E2742"
            - text-align: "left"
            - margin-top: "14px"
          label:
            - font-size: "11px"
            - color: "#7A7388"
            - text-align: "left"

  # ── Card de Música (escuro) ──────────────────────────────────────────────
  - type: media-control
    entity: media_player.sala
    card_mod:
      style: |
        ha-card {
          background: #2E2742 !important;
          border-radius: 26px !important;
          box-shadow: 0 18px 40px rgba(20,15,35,0.35) !important;
          color: #fff !important;
        }
        ha-card * {
          color: #fff !important;
        }

  # ── Nav Inferior ────────────────────────────────────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        icon: mdi:home-variant
        name: ""
        tap_action:
          action: navigate
          navigation_path: /lovelace/dashboard
        styles:
          card:
            - background: "transparent"
            - box-shadow: "none"
            - min-height: "48px"
          icon:
            - color: "#F08648"
            - width: "24px"

      - type: custom:button-card
        icon: mdi:view-grid
        name: ""
        tap_action:
          action: navigate
          navigation_path: /lovelace/dispositivos
        styles:
          card:
            - background: "transparent"
            - box-shadow: "none"
            - min-height: "48px"
          icon:
            - color: "#7A7388"
            - width: "24px"

      - type: custom:button-card
        icon: mdi:refresh-auto
        name: ""
        tap_action:
          action: navigate
          navigation_path: /lovelace/cenas
        styles:
          card:
            - background: "transparent"
            - box-shadow: "none"
            - min-height: "48px"
          icon:
            - color: "#7A7388"
            - width: "24px"

      - type: custom:button-card
        icon: mdi:lightning-bolt
        name: ""
        tap_action:
          action: navigate
          navigation_path: /lovelace/energia
        styles:
          card:
            - background: "transparent"
            - box-shadow: "none"
            - min-height: "48px"
          icon:
            - color: "#7A7388"
            - width: "24px"

      - type: custom:button-card
        icon: mdi:cog
        name: ""
        tap_action:
          action: navigate
          navigation_path: /lovelace/config
        styles:
          card:
            - background: "transparent"
            - box-shadow: "none"
            - min-height: "48px"
          icon:
            - color: "#7A7388"
            - width: "24px"
