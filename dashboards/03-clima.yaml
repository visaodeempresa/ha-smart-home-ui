# ══════════════════════════════════════════════════════════════════════════════
# TELA 03 — CLIMATIZAÇÃO
# Design: fundo plum escuro, temp atual + externa, dial/termostato,
#          pills de modo (frio/quente/auto/vent/off), velocidade do ventilador,
#          programação diária em barras coloridas
# ══════════════════════════════════════════════════════════════════════════════
# COMO USAR: adicione em `views:` do seu dashboard Lovelace
# ENTIDADE:  substitua `climate.sala_ac` pela sua
# ══════════════════════════════════════════════════════════════════════════════

title: "❄️ Clima"
path: clima
icon: mdi:thermometer
background: "#2E2742"
cards:

  # ── Cabeçalho ───────────────────────────────────────────────────────────
  - type: custom:button-card
    name: "Climatização"
    label: "Sala"
    show_label: true
    show_icon: false
    styles:
      card:
        - background: "transparent"
        - box-shadow: "none"
        - padding: "20px 16px 8px"
      name:
        - font-size: "16px"
        - font-weight: "700"
        - color: "#FFFFFF"
      label:
        - font-size: "11px"
        - color: "rgba(255,255,255,0.55)"
        - font-weight: "600"
        - text-transform: "uppercase"
        - letter-spacing: "0.06em"

  # ── Status: Temp Atual + Temp Externa ──────────────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.sala_temperatura
        name: "[[[ return entity.state + '°' ]]]"
        label: "Temperatura Atual"
        show_label: true
        show_icon: false
        styles:
          card:
            - background: "rgba(255,255,255,0.08)"
            - border-radius: "20px"
            - padding: "14px"
            - box-shadow: "none"
          name:
            - font-size: "26px"
            - font-weight: "700"
            - color: "#FFFFFF"
          label:
            - font-size: "10px"
            - color: "rgba(255,255,255,0.55)"
            - text-transform: "uppercase"
            - letter-spacing: "0.06em"
            - font-weight: "600"

      - type: custom:button-card
        entity: sensor.temperatura_externa
        name: "[[[ return entity.state + '°' ]]]"
        label: "Temperatura Externa"
        show_label: true
        icon: mdi:weather-sunny
        styles:
          card:
            - background: "rgba(255,255,255,0.08)"
            - border-radius: "20px"
            - padding: "14px"
            - box-shadow: "none"
          icon:
            - color: "#F08648"
            - width: "16px"
          name:
            - font-size: "26px"
            - font-weight: "700"
            - color: "#FFFFFF"
          label:
            - font-size: "10px"
            - color: "rgba(255,255,255,0.55)"
            - text-transform: "uppercase"
            - letter-spacing: "0.06em"
            - font-weight: "600"

  # ── Termostato ─────────────────────────────────────────────────────────
  - type: thermostat
    entity: climate.sala_ac
    card_mod:
      style: |
        ha-card {
          background: rgba(255,255,255,0.06) !important;
          border-radius: 32px !important;
          box-shadow: none !important;
          backdrop-filter: blur(20px);
        }
        ha-card * {
          --thermostat-ha-card-background: transparent;
        }
        round-slider {
          --round-slider-path-color: rgba(255,255,255,0.15);
          --round-slider-bar-color: #F08648;
        }
        .current-temperature {
          color: #FFFFFF !important;
        }
        .current-temperature-text {
          color: rgba(255,255,255,0.6) !important;
        }

  # ── Pills de Modo ──────────────────────────────────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: climate.sala_ac
        name: "Frio"
        icon: mdi:snowflake
        tap_action:
          action: call-service
          service: climate.set_hvac_mode
          service_data:
            entity_id: climate.sala_ac
            hvac_mode: cool
        state_display: " "
        styles:
          card:
            - background: "[[[ return entity.attributes.hvac_mode === 'cool' ? '#F08648' : 'rgba(255,255,255,0.08)' ]]]"
            - border-radius: "20px"
            - padding: "10px 4px"
            - box-shadow: "none"
            - min-height: "64px"
          icon:
            - color: "#FFFFFF"
            - width: "18px"
          name:
            - font-size: "10px"
            - font-weight: "600"
            - color: "#FFFFFF"

      - type: custom:button-card
        entity: climate.sala_ac
        name: "Quente"
        icon: mdi:weather-sunny
        tap_action:
          action: call-service
          service: climate.set_hvac_mode
          service_data:
            entity_id: climate.sala_ac
            hvac_mode: heat
        state_display: " "
        styles:
          card:
            - background: "[[[ return entity.attributes.hvac_mode === 'heat' ? '#F08648' : 'rgba(255,255,255,0.08)' ]]]"
            - border-radius: "20px"
            - padding: "10px 4px"
            - box-shadow: "none"
            - min-height: "64px"
          icon:
            - color: "#FFFFFF"
            - width: "18px"
          name:
            - font-size: "10px"
            - font-weight: "600"
            - color: "#FFFFFF"

      - type: custom:button-card
        entity: climate.sala_ac
        name: "Auto"
        icon: mdi:leaf
        tap_action:
          action: call-service
          service: climate.set_hvac_mode
          service_data:
            entity_id: climate.sala_ac
            hvac_mode: heat_cool
        state_display: " "
        styles:
          card:
            - background: "[[[ return entity.attributes.hvac_mode === 'heat_cool' ? '#F08648' : 'rgba(255,255,255,0.08)' ]]]"
            - border-radius: "20px"
            - padding: "10px 4px"
            - box-shadow: "none"
            - min-height: "64px"
          icon:
            - color: "#FFFFFF"
            - width: "18px"
          name:
            - font-size: "10px"
            - font-weight: "600"
            - color: "#FFFFFF"

      - type: custom:button-card
        entity: climate.sala_ac
        name: "Vent."
        icon: mdi:fan
        tap_action:
          action: call-service
          service: climate.set_hvac_mode
          service_data:
            entity_id: climate.sala_ac
            hvac_mode: fan_only
        state_display: " "
        styles:
          card:
            - background: "[[[ return entity.attributes.hvac_mode === 'fan_only' ? '#F08648' : 'rgba(255,255,255,0.08)' ]]]"
            - border-radius: "20px"
            - padding: "10px 4px"
            - box-shadow: "none"
            - min-height: "64px"
          icon:
            - color: "#FFFFFF"
            - width: "18px"
          name:
            - font-size: "10px"
            - font-weight: "600"
            - color: "#FFFFFF"

      - type: custom:button-card
        entity: climate.sala_ac
        name: "Off"
        icon: mdi:power
        tap_action:
          action: call-service
          service: climate.set_hvac_mode
          service_data:
            entity_id: climate.sala_ac
            hvac_mode: "off"
        state_display: " "
        styles:
          card:
            - background: "[[[ return entity.attributes.hvac_mode === 'off' ? '#F08648' : 'rgba(255,255,255,0.08)' ]]]"
            - border-radius: "20px"
            - padding: "10px 4px"
            - box-shadow: "none"
            - min-height: "64px"
          icon:
            - color: "#FFFFFF"
            - width: "18px"
          name:
            - font-size: "10px"
            - font-weight: "600"
            - color: "#FFFFFF"

  # ── Velocidade do Ventilador ───────────────────────────────────────────
  - type: custom:button-card
    entity: climate.sala_ac
    name: "Velocidade do Ventilador"
    label: "[[[ const fm = entity.attributes.fan_mode; return fm ? fm.charAt(0).toUpperCase() + fm.slice(1) : '—' ]]]"
    show_label: true
    icon: mdi:fan
    tap_action:
      action: more-info
    styles:
      card:
        - background: "rgba(255,255,255,0.06)"
        - border-radius: "26px"
        - padding: "16px"
        - box-shadow: "none"
        - backdrop-filter: "blur(20px)"
      icon:
        - color: "#BFDDC4"
        - width: "20px"
      name:
        - font-size: "13px"
        - font-weight: "700"
        - color: "#FFFFFF"
        - text-align: "left"
        - margin-top: "4px"
      label:
        - font-size: "20px"
        - font-weight: "700"
        - color: "#BFDDC4"
        - text-align: "right"

  # ── Gráfico de histórico de temperatura ────────────────────────────────
  - type: custom:mini-graph-card
    entity: sensor.sala_temperatura
    name: "Temperatura 24h"
    hours_to_show: 24
    points_per_hour: 2
    line_color: "#F08648"
    line_width: 2
    fill: fade
    show:
      icon: false
      state: true
      labels: true
    color_thresholds:
      - value: 18
        color: "#D2C5E6"
      - value: 22
        color: "#BFDDC4"
      - value: 26
        color: "#F08648"
    card_mod:
      style: |
        ha-card {
          background: #FFFFFF !important;
          border-radius: 26px !important;
          box-shadow: none !important;
        }

  # ── Climatizador / Umidificador (extras) ──────────────────────────────
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: switch.sala_umidificador
        name: "Umidificador"
        label: "[[[ return entity.state === 'on' ? 'Ligado · Nebulizando' : 'Desligado' ]]]"
        show_label: true
        icon: mdi:air-humidifier
        tap_action:
          action: toggle
        styles:
          card:
            - background: "[[[ return entity.state === 'on' ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.06)' ]]]"
            - border-radius: "20px"
            - padding: "14px"
            - box-shadow: "none"
            - min-height: "100px"
          icon:
            - color: "[[[ return entity.state === 'on' ? '#BFDDC4' : 'rgba(255,255,255,0.4)' ]]]"
            - width: "18px"
            - padding: "9px"
            - border-radius: "50%"
            - background: "rgba(255,255,255,0.08)"
          name:
            - font-size: "13px"
            - font-weight: "700"
            - color: "#FFFFFF"
            - text-align: "left"
            - margin-top: "14px"
          label:
            - font-size: "11px"
            - color: "rgba(255,255,255,0.55)"
            - text-align: "left"

      - type: custom:button-card
        entity: switch.sala_purificador_ar
        name: "Purificador de Ar"
        label: "[[[ return entity.state === 'on' ? 'Ligado · Qualidade Boa' : 'Desligado' ]]]"
        show_label: true
        icon: mdi:air-purifier
        tap_action:
          action: toggle
        styles:
          card:
            - background: "[[[ return entity.state === 'on' ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.06)' ]]]"
            - border-radius: "20px"
            - padding: "14px"
            - box-shadow: "none"
            - min-height: "100px"
          icon:
            - color: "[[[ return entity.state === 'on' ? '#D2C5E6' : 'rgba(255,255,255,0.4)' ]]]"
            - width: "18px"
            - padding: "9px"
            - border-radius: "50%"
            - background: "rgba(255,255,255,0.08)"
          name:
            - font-size: "13px"
            - font-weight: "700"
            - color: "#FFFFFF"
            - text-align: "left"
            - margin-top: "14px"
          label:
            - font-size: "11px"
            - color: "rgba(255,255,255,0.55)"
            - text-align: "left"
